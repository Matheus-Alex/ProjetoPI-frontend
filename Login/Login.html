<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Login — Senac</title>
</head>
<body>
    <main class="container">
        <h1>Senac</h1>

        <form id="loginForm">
            <div class="input-box">
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <label for="lembrar">
                    <input id="lembrar" name="lembrar" type="checkbox">
                    Lembrar senha
                </label>
                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit" id="loginBtn">Login</button>
            <p id="loginMessage" style="margin-top: 1rem; text-align: center; display: none;"></p>
        </form>

        <div class="register-link">
            <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </div>
    </main>

<script>
// Credenciais demo
const DEMO_USERS = [
  { email: 'admin@senac.br', senha: '123456', nome: 'Aurora Lima', role: 'Coordenador' }
];

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const messageEl = document.getElementById('loginMessage');
  const btnEl = document.getElementById('loginBtn');

  btnEl.disabled = true;
  btnEl.textContent = 'Entrando...';

  setTimeout(() => {
    const user = DEMO_USERS.find(u => u.email === email && u.senha === senha);
    
    if (user) {
      localStorage.setItem('senac_logged', 'true');
      localStorage.setItem('senac_user', JSON.stringify(user));
      localStorage.setItem('token', 'demo-token');
      localStorage.setItem('user', JSON.stringify(user));

      document.getElementById('loginMessage').innerHTML = '✅ Redirecionando...';
      document.getElementById('loginMessage').style.color = '#2e7d32';
      document.getElementById('loginMessage').style.display = 'block';

      // ✅ CAMINHO ABSOLUTO - FUNCIONA NO NETLIFY
      setTimeout(() => {
        window.location.href = '/Dashboard/daskboard.html';
      }, 1000);
    } else {
      document.getElementById('loginMessage').innerHTML = '❌ Credenciais inválidas<br><small>admin@senac.br / 123456</small>';
      document.getElementById('loginMessage').style.color = '#c62828';
      document.getElementById('loginMessage').style.display = 'block';
      btnEl.disabled = false;
      btnEl.textContent = 'Login';
    }
  }, 800);
});
</script>
</body>
</html>
