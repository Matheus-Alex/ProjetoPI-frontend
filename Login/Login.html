<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Login — Senac</title>
</head>
<body>

    <main class="container">
        <h1>Senac</h1>

        <form id="loginForm" action="#" method="post">

            <div class="input-box">
                <input
                    id="usuario"
                    name="usuario"
                    type="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <label for="lembrar">
                    <input id="lembrar" name="lembrar" type="checkbox">
                    Lembrar senha
                </label>
                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="register-link">
            <p>Não tem uma conta? <a href="../Cadastro/cadastro.html">Cadastre-se</a></p>
        </div>

          <!-- Conecte o historico.js aqui quando quiser ativar busca e exclusão -->
  <!-- <script src="historico.js"></script> -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Armazena que o usuário fez login
      localStorage.setItem('userLogged', 'true');
      localStorage.setItem('userName', document.getElementById('usuario').value);
      
      // Redireciona para o dashboard
      window.location.href = '../Dashboard/daskboard.html';
    });
  </script>

    </main>

</body>
</html>
