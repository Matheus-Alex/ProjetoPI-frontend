<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Login — Senac</title>
</head>
<body>
    <script type="module">
        import APIClient from '../public/js/api-client.js';

        // Se já está logado, redireciona para dashboard
        if (APIClient.isAuthenticated()) {
            window.location.href = '/Dashboard/daskboard.html';
        }

        // Event listener para o formulário de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const messageEl = document.getElementById('loginMessage');
            const btnEl = document.getElementById('loginBtn');

            // Desabilita o botão durante o login
            btnEl.disabled = true;
            btnEl.textContent = 'Entrando...';
            messageEl.style.display = 'none';

            try {
                const response = await APIClient.login(email, senha);

                if (response.error) {
                    messageEl.style.color = '#c62828';
                    messageEl.textContent = response.error;
                    messageEl.style.display = 'block';
                    btnEl.disabled = false;
                    btnEl.textContent = 'Login';
                } else if (response.accessToken) {
                    messageEl.style.color = '#4CAF50';
                    messageEl.textContent = 'Login realizado com sucesso!';
                    messageEl.style.display = 'block';
                    
                    // Aguarda um pouco e redireciona
                    setTimeout(() => {
                        window.location.href = '/Dashboard/daskboard.html';
                    }, 800);
                } else {
                    messageEl.style.color = '#c62828';
                    messageEl.textContent = 'Erro desconhecido. Tente novamente.';
                    messageEl.style.display = 'block';
                    btnEl.disabled = false;
                    btnEl.textContent = 'Login';
                }
            } catch (error) {
                messageEl.style.color = '#c62828';
                messageEl.textContent = 'Erro ao fazer login. Tente novamente.';
                messageEl.style.display = 'block';
                btnEl.disabled = false;
                btnEl.textContent = 'Login';
            }
        });
    </script>

    <main class="container">
        <h1>Senac</h1>

        <form id="loginForm">

            <div class="input-box">
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <label for="lembrar">
                    <input id="lembrar" name="lembrar" type="checkbox">
                    Lembrar senha
                </label>
                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit" id="loginBtn">Login</button>
            <p id="loginMessage" style="margin-top: 1rem; text-align: center; display: none;"></p>

        </form>

        <div class="register-link">
            <p>Não tem uma conta? <a href="../Cadastro/cadastro.html">Cadastre-se</a></p>
        </div>

          <!-- Conecte o historico.js aqui quando quiser ativar busca e exclusão -->
  <!-- <script src="historico.js"></script> -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Armazena que o usuário fez login
      localStorage.setItem('userLogged', 'true');
      localStorage.setItem('userName', document.getElementById('usuario').value);
      
      // Redireciona para o dashboard
      window.location.href = '../Dashboard/daskboard.html';
    });
  </script>

    </main>

</body>
</html>
